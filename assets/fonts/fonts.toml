# Configuration for scripts/convert_fonts.py.
#
# Every *.ttf / *.otf / *.woff file dropped next to this file is converted into
# LVGL font C sources under src/app/fonts/ during the build.
#
# This file is optional: without it every font is converted with the defaults
# below (16 px, 4 bpp, ASCII + Latin-1 accents).

[defaults]
# Default glyph size in px when a file does not define size/sizes.
size = 16
# Anti-aliasing depth: 1, 2, 4 or 8 bits per pixel. 4 matches the built-ins.
bpp = 4
# Unicode ranges/codepoints/characters to include, replacing the built-in
# default of ["0x20-0x7F", "0xA0-0xFF"].
# ranges = ["0x20-0x7F", "0xA0-0xFF"]

# Per-font overrides. The key must be the file name exactly as it appears in
# this folder.
#
#   size    -> one output size
#   sizes   -> several output sizes from the same file (one C file each)
#   bpp     -> 1, 2, 4 or 8
#   name    -> symbol base name; the generated font becomes
#              lv_font_<name>_<size> (default: sanitized file name).
#              Must not shadow an LVGL built-in such as lv_font_montserrat_48.
#   ranges  -> unicode ranges ("0x20-0x7F"), single codepoints ("0x2022") or
#              literal characters ("E") - REPLACES the default ranges
#   symbols -> literal characters ADDED on top of the ranges

# LVGL ships lv_font_montserrat_{8..48} (even sizes) as built-ins, so this
# continues the same family and even-size pattern from 50 onwards.
[files."Montserrat-Medium.ttf"]
name = "montserrat"
sizes = [50, 52, 54, 56, 58, 60, 62, 64, 66, 68, 70, 72, 74, 76, 78, 80, 82, 84, 86, 88, 90, 92, 94, 96, 98, 100]

